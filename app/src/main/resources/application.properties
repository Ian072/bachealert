# Puerto: Render lo asigna en la variable PORT; en Codespaces se usa 8080
server.port=${PORT:8080}

# Tamaño máximo de foto (por defecto Spring solo acepta 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base de datos H2 en modo archivo: los datos sobreviven al reinicio
spring.datasource.url=jdbc:h2:file:./data/bachealert
spring.datasource.username=sa
spring.datasource.password=

# JPA crea o actualiza las tablas automáticamente según las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2: encendida en Codespaces, apagada en Render (H2_CONSOLE=false)
spring.h2.console.enabled=${H2_CONSOLE:true}

# Cierra la conexión a la base de datos al terminar cada petición
spring.jpa.open-in-view=false
