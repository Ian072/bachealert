# Tamaño máximo de foto (por defecto Spring solo acepta 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base de datos H2 en modo archivo: los datos sobreviven al reinicio
spring.datasource.url=jdbc:h2:file:./data/bachealert
spring.datasource.username=sa
spring.datasource.password=

# JPA crea o actualiza las tablas automáticamente según las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Consola web para ver la base de datos en el navegador (solo en desarrollo)
spring.h2.console.enabled=true